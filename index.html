<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="root"></div>

<script type="text/babel" src="/assets/components.jsx"></script>
<script type="text/babel" src="/assets/pages-1.jsx"></script>
<script type="text/babel" src="/assets/pages-2.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const PAGE_META = {
  home:    { title: () => CONTENT.site.title, desc: () => CONTENT.site.description },
  about:   { title: () => 'About — ' + CONTENT.site.title, desc: () => 'How C4C works, who we are, and our financial transparency.' },
  work:    { title: () => 'What we do — ' + CONTENT.site.title, desc: () => 'Energy, agriculture, biodiversity and heavy industry — four areas, one framework.' },
  aea:     { title: () => 'Affordable Energy Australia — ' + CONTENT.site.title, desc: () => 'Proven for families. True on cost. Secure for the grid.' },
  news:    { title: () => 'News — ' + CONTENT.site.title, desc: () => 'Submissions, op-eds, statements, events. The work, on the record.' },
  media:   { title: () => 'Media & Webinars — ' + CONTENT.site.title, desc: () => 'C4C’s full archive of articles, webinars, submissions, statements and videos.' },
  donate:  { title: () => 'Donate — ' + CONTENT.site.title, desc: () => 'Fund the policy work. Tax-deductible. DGR endorsed.' },
  contact: { title: () => 'Contact — ' + CONTENT.site.title, desc: () => 'Get in touch with C4C — we read everything.' },
  privacy: { title: () => 'Privacy Policy — ' + CONTENT.site.title, desc: () => 'How the Coalition for Conservation collects, uses and protects your information.' },
};

function metaFor(page) {
  if (page.startsWith('issue:')) {
    const slug = page.split(':')[1];
    const issue = (CONTENT.issues || {})[slug];
    if (issue) return { title: () => issue.title + ' — ' + CONTENT.site.title, desc: () => issue.tagline };
  }
  if (page.startsWith('article:')) {
    return { title: () => 'Media & Webinars — ' + CONTENT.site.title, desc: () => CONTENT.site.description };
  }
  return PAGE_META[page] || PAGE_META.home;
}

function pathToPage(path) {
  if (!path || path === '/') return 'home';
  if (path === '/about') return 'about';
  if (path === '/work') return 'work';
  if (path === '/campaigns') return 'aea';
  if (path === '/news') return 'news';
  if (path === '/media-and-webinars' || path === '/media') return 'media';
  if (path === '/donate') return 'donate';
  if (path === '/contact') return 'contact';
  if (path === '/privacy') return 'privacy';
  const am = path.match(/^\/media\/([a-z0-9-]+)$/);
  if (am) return 'article:' + am[1];
  const m = path.match(/^\/issues\/([a-z-]+)$/);
  if (m) return 'issue:' + m[1];
  return 'home';
}

function pageToPath(page) {
  if (page === 'home') return '/';
  if (page === 'about') return '/about';
  if (page === 'work') return '/work';
  if (page === 'aea') return '/campaigns';
  if (page === 'news') return '/news';
  if (page === 'media') return '/media-and-webinars';
  if (page === 'donate') return '/donate';
  if (page === 'contact') return '/contact';
  if (page === 'privacy') return '/privacy';
  if (page.startsWith('article:')) return '/media/' + page.split(':')[1];
  if (page.startsWith('issue:')) return '/issues/' + page.split(':')[1];
  return '/';
}

function setMetaTag(selector, attr, value) {
  const el = document.querySelector(selector);
  if (el) el.setAttribute(attr, value);
}

function applyMeta(page) {
  const meta = metaFor(page);
  const title = meta.title();
  const desc = meta.desc();
  document.title = title;
  setMetaTag('meta[name="description"]', 'content', desc);
  setMetaTag('meta[property="og:title"]', 'content', title);
  setMetaTag('meta[property="og:description"]', 'content', desc);
  setMetaTag('meta[property="og:url"]', 'content', location.href);
  setMetaTag('meta[name="twitter:title"]', 'content', title);
  setMetaTag('meta[name="twitter:description"]', 'content', desc);
  setMetaTag('link[rel="canonical"]', 'href', location.href);
  if (CONTENT.site.ogImage) {
    setMetaTag('meta[property="og:image"]', 'content', CONTENT.site.ogImage);
    setMetaTag('meta[name="twitter:image"]', 'content', CONTENT.site.ogImage);
  }
}

function App() {
  const [page, setPageState] = useState(() => pathToPage(window.location.pathname));

  useEffect(() => {
    const onPop = () => setPageState(pathToPage(window.location.pathname));
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const setPage = useCallback((next) => {
    const path = pageToPath(next);
    if (window.location.pathname !== path) {
      window.history.pushState({}, '', path);
    }
    setPageState(next);
  }, []);

  useEffect(() => {
    applyMeta(page);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [page]);

  let body;
  if (page === 'home') body = <HomePage setPage={setPage} />;
  else if (page === 'about') body = <AboutPage setPage={setPage} />;
  else if (page === 'work') body = <WorkPage setPage={setPage} />;
  else if (page === 'aea') body = <AEAPage setPage={setPage} />;
  else if (page === 'news') body = <NewsPage setPage={setPage} />;
  else if (page === 'media') body = <MediaPage setPage={setPage} />;
  else if (page === 'donate') body = <DonatePage setPage={setPage} />;
  else if (page === 'contact') body = <ContactPage setPage={setPage} />;
  else if (page === 'privacy') body = <PrivacyPage setPage={setPage} />;
  else if (page.startsWith('article:')) body = <MediaArticlePage slug={page.split(':')[1]} setPage={setPage} />;
  else if (page.startsWith('issue:')) body = <IssuePage slug={page.split(':')[1]} setPage={setPage} />;
  else body = <HomePage setPage={setPage} />;

  const navPage = page.startsWith('issue:') ? 'work' : (page.startsWith('article:') ? 'media' : page);

  return (
    <React.Fragment>
      <header>
        <Nav page={navPage} setPage={setPage} />
      </header>
      <main id="main" tabIndex={-1} data-screen-label={page}>{body}</main>
      <Footer setPage={setPage} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
