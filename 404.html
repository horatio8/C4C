<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Coalition for Conservation</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
<style>
  body { background: var(--paper, #ecebe2); color: var(--ink, #1a1a1a); margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
  .wrap { max-width: 640px; }
  .eyebrow { font-family: var(--mono, ui-monospace, Menlo, monospace); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ochre-2, #8a5a1f); }
  h1 { font-family: var(--display, Georgia, serif); font-size: clamp(48px, 8vw, 96px); line-height: 0.95; font-weight: 300; letter-spacing: -0.03em; margin: 24px 0; }
  h1 .italic { font-style: italic; color: var(--terracotta-2, #a14b2a); }
  p { font-size: 18px; line-height: 1.55; max-width: 520px; }
  .links { margin-top: 40px; display: flex; gap: 16px; flex-wrap: wrap; }
  .links a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 12px 20px; border: 1px solid currentColor;
    text-decoration: none; color: inherit;
    font-size: 14px; border-radius: 4px;
  }
  .links a.primary { background: var(--ink, #141714); color: var(--paper, #ecebe2); border-color: var(--ink, #141714); }
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">Error 404 — Page not found</div>
  <h1>Off the<br><span class="italic">map.</span></h1>
  <p>The page you're looking for has moved, or never existed. Either way, we'd rather get you back to something useful.</p>
  <div class="links">
    <a class="primary" href="/">← Back to home</a>
    <a href="/news">Read the latest</a>
    <a href="/contact">Get in touch</a>
  </div>
</main>
</body>
</html>
